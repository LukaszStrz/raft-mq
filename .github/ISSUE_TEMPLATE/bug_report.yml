name: Bug report
description: Report a reproducible defect or unexpected behavior in raft-mq
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Minimal code or steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      description: Which NuGet package version or git commit SHA are you using?
      placeholder: "e.g., 0.1.0 or main"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: .NET Runtime & OS
      description: Target framework, runtime version (`dotnet --info`), and operating system.
      placeholder: "e.g., .NET 10.0 on Ubuntu 24.04 / Windows 11"
    validations:
      required: true
