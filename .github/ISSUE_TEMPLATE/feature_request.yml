name: Feature request
description: Propose a new capability, API improvement, or design enhancement
title: "[Feature]: "
labels: ["type: enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve? Why is this needed in raft-mq?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution or API shape
      description: Describe the behavior or public API you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you have considered.
    validations:
      required: false
